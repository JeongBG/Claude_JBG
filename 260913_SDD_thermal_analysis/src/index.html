<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wafer 열화상 온도 분석 대시보드</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Wafer 열화상 온도 분석 대시보드</h1>
    <p class="app-subtitle">
      Hot-plate 단독 측정 4장(top/bottom/left/right) + Wafer 안착 측정 4장(1~4사분면) 기반 온도 분석
    </p>
  </header>

  <main class="app-main">
    <section class="panel">
      <h2 class="panel-title">1. 원본 열화상 이미지</h2>
      <div id="gallery-root"></div>
    </section>

    <section class="panel">
      <h2 class="panel-title">2. Wafer 온도 분포 분석</h2>
      <div id="wafer-analysis-root"></div>
    </section>

    <section class="panel">
      <h2 class="panel-title">3. Hot-plate ↔ Wafer 비교</h2>
      <div id="compare-root"></div>
    </section>
  </main>

  <div id="image-modal" class="image-modal">
    <div class="image-modal-content">
      <button id="image-modal-close" class="image-modal-close" aria-label="닫기">✕</button>
      <img id="image-modal-img" src="" alt="" />
      <p id="image-modal-caption"></p>
    </div>
  </div>

  <script src="data/dataset.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/wafer-analysis.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
